# Inactive example: copying this into .github/workflows is a separate change.
name: TLS lab source checks
on:
  pull_request:
    paths: ['examples/tls-certificate-automation/**']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/tls-certificate-automation
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - name: Python behavioral tests
        run: python3 scripts/local_tests.py
      - name: Terraform syntax and mocked plans
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive bootstrap identity foundation edge
          for root in bootstrap identity foundation edge; do
            TF_DATA_DIR="$RUNNER_TEMP/tls-$root" terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            TF_DATA_DIR="$RUNNER_TEMP/tls-$root" terraform -chdir="$root" validate
            TF_DATA_DIR="$RUNNER_TEMP/tls-$root" terraform -chdir="$root" test
          done
